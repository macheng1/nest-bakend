version: '3.8'

services:
  # ==========================================
  # 1. PostgreSQL 16 数据库服务
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: nest_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: core_db
      TZ: Asia/Shanghai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d core_db']
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. pgAdmin 4 (PostgreSQL 可视化管理)
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nest_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      TZ: Asia/Shanghai
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # 3. MySQL 8.0 数据库服务
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: nest_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: legacy_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password123
      TZ: Asia/Shanghai
    command:
      # 字符集统一为 utf8mb4，并采用标准密码认证插件
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-prootpassword123']
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 4. Redis 7 缓存与消息中间件
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: nest_redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass redispassword123 
      --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redispassword123', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  mysql_data:
    driver: local
  redis_data:
    driver: local